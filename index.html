<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habitat — grow a balanced life</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#cfe9ff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Habitat" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon.svg" />
<!--
  Free Time Balance — clickable prototype v3 (working name placeholder). Spec FTB-20260628-001.
  Panel-approved mechanics:
   - 7 categories incl. "Time for me" (never metered, never nudged "rest more")
   - self-recording, no instant score; daily visible trace = "blooms" (not a score)
   - living world + companion creature: THRIVES BIG, RESTS SMALL (never withers/sad/sick)
   - PROGRESSION via BALANCE: a "balanced day" = >=3 distinct categories that day → +1 permanent
     growth point. Monotonic, never lost, no streak/countdown. World grows + creature gets outfits.
     Grinding one category does nothing (breadth only). Shown as world-richness, number hidden.
   - QUANTITY (how long/far) = optional DIARY detail only; NEVER feeds balance, levels or any score.
   - editable per-kid activity examples (autonomy)
   - forgiving 7-day rolling window for current vitality; survives neglect
   - data firewall: child sees own world; parent sees only coarse "is the family OK?"
   - Yes Day = surprise celebration; NO progress bar / NO "collect N"
   - PHOTO = child's own memory; local only, EXIF stripped (canvas re-encode), never shown to parent
   - local-first (localStorage only); NO network, NO trackers; English-first + SK
-->
<style>
  :root{--ink:#222838;--muted:#717a8c;--card:#fff;--radius:22px;--shadow:0 12px 34px rgba(31,36,51,.12);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--font);color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,var(--sky-top,#cfe9ff) 0%,var(--sky-mid,#e8f6ec) 55%,#f5efe3 100%);transition:background 1.4s ease;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  header.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .brand{font-weight:800;font-size:20px}.brand .dot{color:#f6a623}.spacer{flex:1}
  .chip{border:none;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);padding:8px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .chip:hover{background:#fff}.chip.on{background:#f6a623;color:#fff}
  .who{font-size:14px;color:var(--muted);margin:2px 0 12px}
  .profiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .pfile{border:none;cursor:pointer;font:inherit;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;font-weight:600}
  .pfile .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff}
  .pfile.active{outline:3px solid #f6a623}

  .stage{position:relative;height:430px;border-radius:28px;margin-top:6px;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%,#ffffffaa,#ffffff00 60%);box-shadow:var(--shadow)}
  @media(max-width:560px){.stage{height:500px}}
  /* scenery */
  #bgscene{position:absolute;inset:0;overflow:hidden;border-radius:28px;z-index:0;pointer-events:none}
  .scenery{position:absolute;inset:0;width:100%;height:100%}
  .ray{fill:#ffd45e}.rays{transform-box:fill-box;transform-origin:center;animation:raysrot 70s linear infinite}
  .sun{animation:sunpulse 6s ease-in-out infinite}.sun,.moon{transition:opacity 1.2s}.moon{opacity:0}
  .stage.night .sun{opacity:0}.stage.night .moon{opacity:1}
  .stars{opacity:0;transition:opacity 1.2s;fill:#fff7da}.stars circle{animation:twinkle 3s ease-in-out infinite}.stage.night .stars{opacity:.95}
  @keyframes raysrot{to{transform:rotate(360deg)}}
  @keyframes sunpulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,212,94,.5))}50%{filter:drop-shadow(0 0 13px rgba(255,212,94,.85))}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  .tree,.grass{transform-box:fill-box;transform-origin:50% 100%;animation:treesway 6s ease-in-out infinite;animation-delay:var(--d,0s)}.grass{animation-duration:4.5s}
  @keyframes treesway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .blades{transform-box:fill-box;transform-origin:center;animation:raysrot 16s linear infinite}
  .flagcloth{transform-box:fill-box;transform-origin:0 50%;animation:flagwave 2.4s ease-in-out infinite}
  @keyframes flagwave{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.65)}}
  .build{transition:opacity 1.4s ease}
  .clouds{position:absolute;inset:0}
  .cloud{position:absolute;width:62px;height:20px;background:#fff;border-radius:999px;opacity:.85;box-shadow:17px 6px 0 -4px #fff,-17px 7px 0 -6px #fff;filter:blur(.2px)}
  .stage.night .cloud{opacity:.22}
  .c1{top:16%;animation:cloudA 36s linear infinite}.c2{top:33%;transform:scale(.8);animation:cloudB 48s linear infinite}.c3{top:9%;transform:scale(1.15);opacity:.7;animation:cloudC 62s linear infinite}
  @keyframes cloudA{from{left:-90px}to{left:108%}}@keyframes cloudB{from{left:-120px}to{left:114%}}@keyframes cloudC{from{left:-150px}to{left:120%}}
  .birds{position:absolute;inset:0}.bird{position:absolute;width:20px;height:12px;opacity:.8}.stage.night .bird{opacity:0}
  .b1{top:22%;animation:birdfly 24s linear infinite}.b2{top:29%;animation:birdfly 32s linear infinite 7s}
  @keyframes birdfly{0%{left:-30px;transform:translateY(0)}50%{transform:translateY(-16px)}100%{left:110%;transform:translateY(0)}}
  .particles{position:absolute;inset:0}
  .pp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe6a3;opacity:0;box-shadow:0 0 6px #ffe6a3;animation:ppfloat var(--t,9s) ease-in-out infinite;animation-delay:var(--dl,0s)}
  .stage.night .pp{background:#bdf0a8;box-shadow:0 0 9px #bdf0a8}
  @keyframes ppfloat{0%{opacity:0;transform:translateY(12px)}20%{opacity:.9}50%{transform:translateY(-20px)}80%{opacity:.5}100%{opacity:0;transform:translateY(12px)}}
  /* zones */
  .zone{position:absolute;width:116px;height:116px;transform:translate(-50%,-50%);cursor:pointer;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:50%;transition:filter 1s,opacity 1s,transform .3s}
  .zone:hover{transform:translate(-50%,-50%) scale(1.05)}
  .zone .blob{position:absolute;inset:0;border-radius:46% 54% 52% 48%/52% 46% 54% 48%;box-shadow:inset 0 -8px 18px rgba(0,0,0,.06),0 8px 18px rgba(0,0,0,.07);transition:background 1s;animation:wobble 9s ease-in-out infinite}
  .zone .ico{position:relative;font-size:32px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
  .zone .lbl{position:relative;font-size:11.5px;font-weight:700;margin-top:3px;color:#2c3344}
  .zone .st{position:relative;font-size:10px;color:#5d6677;min-height:12px}
  .zone.vibrant .blob{animation:wobble 5s ease-in-out infinite}.zone.vibrant .ico{animation:pop 5s ease-in-out infinite}
  .zone.sleepy{filter:grayscale(.8);opacity:.6}.zone.sleepy .zzz{position:absolute;top:6px;right:14px;font-size:12px;color:#98a1b2;animation:drift 3.2s infinite}
  @keyframes wobble{0%,100%{border-radius:46% 54% 52% 48%/52% 46% 54% 48%}50%{border-radius:54% 46% 48% 52%/46% 54% 48% 52%}}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes drift{0%{opacity:.2;transform:translateY(2px)}50%{opacity:.85;transform:translateY(-4px)}100%{opacity:.2;transform:translateY(2px)}}
  .zone.today .blob{box-shadow:inset 0 -8px 18px rgba(0,0,0,.06),0 0 0 3px rgba(246,166,35,.4),0 8px 18px rgba(0,0,0,.08)}
  .bloom{position:absolute;bottom:-3px;font-size:16px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));transform-origin:bottom center;animation:bloomin .5s ease both;z-index:3}
  @keyframes bloomin{0%{transform:scale(0) translateY(6px);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
  .tbadge{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#b06a00;background:#fff4e0;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  /* creatures */
  #buddy{position:absolute;width:84px;height:84px;left:50%;top:60%;transform:translate(-50%,-50%);transition:left 1.6s cubic-bezier(.5,.05,.3,1),top 1.6s cubic-bezier(.5,.05,.3,1);z-index:5;pointer-events:none}
  #buddy2{position:absolute;width:54px;height:54px;left:50%;top:60%;transform:translate(-50%,-50%);transition:left 1.6s cubic-bezier(.5,.05,.3,1),top 1.6s cubic-bezier(.5,.05,.3,1);z-index:4;pointer-events:none;display:none}
  #buddy .body,#buddy2 .body{transform-origin:50% 100%}
  #buddy.happy .body,#buddy2 .body{animation:hop 1.1s ease-in-out infinite}
  #buddy.content .body{animation:sway 4s ease-in-out infinite}
  #buddy.nap .body{animation:breathe 4.5s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}30%{transform:translateY(0) scaleY(.86)}55%{transform:translateY(-16px) scaleY(1.06)}}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(2px) scaleY(.97)}}
  #buddy .spark{opacity:0}#buddy.happy .spark{animation:spark 1.6s ease-in-out infinite}
  @keyframes spark{0%,100%{opacity:0;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}

  .worldsay{margin:12px 0 0;font-size:15px;color:#3a4256;font-weight:600;text-align:center}
  #grown{text-align:center;font-size:12.5px;color:#5d6677;margin-top:3px;cursor:pointer}
  #grown b{color:#b06a00}
  #journey{display:flex;gap:7px;justify-content:center;margin-top:5px;font-size:15px;flex-wrap:wrap}
  .mstone.done{opacity:1}.mstone.next{opacity:.65}.mstone.far{opacity:.28;color:#9aa3b2;font-weight:700}
  /* long-neglect: whimsical thorns + a sleepy stryga (NO penalty, NO blame, clears to a gift) */
  .zone.thorny{filter:grayscale(.45) brightness(.99);opacity:.82}
  .thorns{position:absolute;bottom:-2px;left:0;width:100%;height:38px;z-index:1;pointer-events:none}
  .stryga{position:absolute;top:0;left:6px;font-size:20px;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));animation:breathe 4.5s ease-in-out infinite}
  .stryga .sz{font-size:11px;color:#9aa3b2;margin-left:1px}
  .keepsake{position:absolute;top:-4px;right:8px;font-size:20px;z-index:4;animation:bloomin .6s ease both}

  .mlist{margin-top:10px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
  .mrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #eef0f4;cursor:pointer}.mrow:last-child{border-bottom:none}
  .mrow .mi{font-size:20px;width:26px;text-align:center}.mrow .mn{flex:1;font-weight:600}
  .mrow .bar{width:96px;height:8px;border-radius:99px;background:#eef0f4;overflow:hidden}.mrow .bar>i{display:block;height:100%;border-radius:99px}
  .mrow .ms{font-size:11px;color:var(--muted);width:60px;text-align:right}

  .nudge{margin:14px 0 0;background:#fff7e8;border:1px solid #f6d79a;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
  .nudge .txt{flex:1;font-size:14px}.nudge button{border:none;font:inherit;border-radius:999px;padding:7px 12px;cursor:pointer}
  .nudge .later{background:transparent;color:var(--muted)}.nudge .ok{background:#f6a623;color:#fff;font-weight:600}

  .ov{position:fixed;inset:0;background:rgba(20,24,33,.42);display:none;align-items:flex-end;justify-content:center;z-index:30}.ov.show{display:flex}
  .sheet{background:#fff;border-radius:22px 22px 0 0;max-width:540px;width:100%;padding:18px 18px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:88vh;overflow:auto}
  @media(min-width:560px){.ov{align-items:center}.sheet{border-radius:22px}}
  .sheet h3{margin:4px 0 2px;font-size:18px}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
  .lblmini{font-size:12px;color:var(--muted);margin:10px 0 6px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
  .qchip{border:1px solid #e6e8ee;background:#fafbfc;border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
  .qchip.sel{background:#fff0d6;border-color:#f6c065;color:#9a5b00}
  .acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .act{border:1px solid #e6e8ee;background:#fafbfc;border-radius:14px;padding:12px 14px;font:inherit;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center}
  .act:hover{border-color:#f6a623;background:#fff8ee}.act.addown{border-style:dashed;color:#5d6677}
  .sheet .close{margin-top:14px;width:100%;background:#eef0f4;border:none;border-radius:14px;padding:12px;font:inherit;cursor:pointer}

  #memStory{margin-bottom:14px}
  .story-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed #eef0f4}
  .story-row .si{font-size:18px}.story-row .sd{margin-left:auto;color:var(--muted);font-size:11px}
  .mem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .mem{position:relative;border-radius:14px;overflow:hidden;background:#f1f3f7;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .mem img{width:100%;height:130px;object-fit:cover;display:block}.mem .cap{padding:7px 9px;font-size:12px;color:#3a4256}
  .mem .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:99px;width:24px;height:24px;cursor:pointer;font-size:13px}
  .mem-empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}
  .jlvl{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .jl-n{font-weight:800;font-size:18px;color:#b06a00}.jl-d{font-size:13px;color:var(--muted)}
  .jhead{font-weight:700;margin:16px 0 6px;font-size:14px}
  .sum-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px dashed #f0f1f4}
  .sum-row .su-i{font-size:17px}.sum-row .su-n{flex:1}.sum-row .su-d{color:var(--muted)}
  #jrnNote{width:100%;min-height:64px;border:1px solid #e6e8ee;border-radius:12px;padding:10px;font:inherit;font-size:14px;margin-top:4px;resize:vertical}
  .jremove{margin-top:14px;width:100%;background:transparent;border:1px solid #f0d2d2;color:#b4566a;border-radius:12px;padding:9px;font:inherit;font-size:13px;cursor:pointer}
  #pManage .pm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #eef0f4}
  #pManage .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff}
  #pManage .pm-n{flex:1;font-weight:600}
  .pm-del{border:none;background:#fbeaea;color:#b4566a;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
  .pm-lock{border:none;background:#eef3fb;color:#456;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;margin-right:6px}
  .pm-add,.pm-pin{margin-top:10px;width:100%;border:1px solid #e6e8ee;background:#fafbfc;border-radius:12px;padding:10px;font:inherit;cursor:pointer}
  .pm-pin{margin-top:8px;color:#5d6677}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:#222838;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;z-index:40;transition:.35s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .parent{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:8px}
  .parent h2{margin:0 0 4px;font-size:20px}.parent .lead{color:var(--muted);font-size:14px;margin-bottom:18px}
  .signal{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:#f4f8f4;margin-bottom:12px}
  .signal .big{font-size:34px}.signal .s-txt strong{display:block;font-size:16px}.signal .s-txt span{font-size:13px;color:var(--muted)}
  .yesday{display:none;background:linear-gradient(120deg,#fff3d6,#ffe0e9);border:1px solid #f6d79a;border-radius:16px;padding:16px;margin-top:6px}.yesday.show{display:block}
  .firewall{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5;border-top:1px dashed #e0e3ea;padding-top:12px}
  .footnote{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}

  @media print{
    body{background:#fff}.topbar,.profiles,.nudge,.chip,.footnote,.ov,.toast,.who,#buddy,#buddy2,#grown{display:none!important}
    .stage{box-shadow:none;border:2px solid #e6e8ee;height:440px}.zone.sleepy{filter:none;opacity:1}.zone.sleepy .ico{opacity:.4}.printhead{display:block!important}
  }
  .printhead{display:none;text-align:center;margin-bottom:10px}.printhead h1{margin:0;font-size:26px}.printhead p{margin:4px 0 0;color:#6b7280;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="printhead"><h1 id="ph-title">My World</h1><p id="ph-sub">Colour a region every time you do something there.</p></div>
  <header class="topbar">
    <div class="brand">🌍 <span id="brand">your world</span><span class="dot">.</span></div>
    <div class="spacer"></div>
    <button class="chip" id="memBtn">🖼️ <span id="memLbl">My week</span></button>
    <button class="chip" id="familyBtn">👪 <span id="familyLbl">Family</span></button>
    <button class="chip" id="strygaBtn">🧙‍♀️ <span id="strygaLbl">Visitor</span></button>
    <button class="chip" id="minBtn">📋 <span id="minLbl">Simple</span></button>
    <button class="chip" id="installBtn" style="display:none">⬇️ <span id="installLbl">Install</span></button>
    <button class="chip" id="updateBtn">🔄 <span id="updateLbl">Update</span></button>
    <button class="chip" id="langBtn">SK</button>
    <button class="chip" id="printBtn">🖨️ <span id="printLbl">Print</span></button>
    <button class="chip" id="modeBtn">👋 <span id="modeLbl">Parent</span></button>
  </header>
  <div class="who" id="who"></div>
  <div id="famHint" style="display:none;background:#eaf3ff;border:1px solid #bcd8f7;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13px;color:#2b4a6b;cursor:pointer"></div>
  <div class="profiles" id="profiles"></div>

  <section id="childView">
    <div class="worldsay" id="worldsay"></div>
    <div id="grown"></div>
    <div id="journey"></div>
    <div class="stage day" id="stage">
      <div id="bgscene">
        <svg class="scenery" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
          <g class="stars">
            <circle cx="40" cy="30" r="1.4"/><circle cx="90" cy="20" r="1.1"/><circle cx="150" cy="38" r="1.5"/>
            <circle cx="220" cy="24" r="1.2"/><circle cx="280" cy="40" r="1.3"/><circle cx="350" cy="22" r="1.4"/>
            <circle cx="120" cy="60" r="1"/><circle cx="300" cy="64" r="1.1"/>
          </g>
          <g class="sun" transform="translate(334,46)">
            <g class="rays">
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(0)"/>
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(45)"/>
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(90)"/>
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(135)"/>
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(180)"/>
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(225)"/>
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(270)"/>
              <rect class="ray" x="-1.3" y="-30" width="2.6" height="9" rx="1.3" transform="rotate(315)"/>
            </g>
            <circle r="15" fill="#ffd45e"/><circle r="15" fill="#fff" opacity=".18"/>
          </g>
          <g class="moon" transform="translate(334,46)"><circle r="13" fill="#f5f2dc"/><circle cx="-4" cy="-3" r="2.2" fill="#e6e0c2"/><circle cx="3" cy="4" r="2.8" fill="#e6e0c2"/></g>
          <path class="hill" d="M0,150 Q110,112 210,140 Q320,168 400,134 L400,200 L0,200 Z" fill="#c2e6bd"/>
          <path class="hill" d="M0,172 Q120,144 250,168 Q340,184 400,162 L400,200 L0,200 Z" fill="#a6d99c"/>
          <!-- progression buildings (toggled by growth) -->

const today=()=>new Date().toISOString().slice(0,10);
const ageOf=d=>Math.floor((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/864e5);

/* vitality (current, 7-day forgiving window) */
function vit(p,k){let s=0;for(const l of p.logs){if(l.cat!==k)continue;const a=ageOf(l.date);if(a<0||a>=WINDOW_DAYS)continue;s+=1-(a/(WINDOW_DAYS*1.6));}return Math.min(1,s/TARGET_PER_WEEK);}
const stOf=v=>v>=0.6?"vibrant":v>=0.28?"ok":"sleepy";
const todayCount=(p,k)=>p.logs.filter(l=>l.cat===k&&l.date===today()).length;
const FLOWERS=["🌼","🌷","🌸"];
let lastLogged=null;

/* progression (lifetime, monotonic) — a balanced day = >=3 distinct categories AND a different
   combo than the previous calendar day (must vary; no repeating the same trio two days running) */
const setOn=(p,d)=>new Set(p.logs.filter(l=>l.date===d).map(l=>l.cat));
const keyOf=s=>[...s].sort().join(",");
const prevDay=d=>new Date(new Date(d+"T00:00:00").getTime()-864e5).toISOString().slice(0,10);
function balancedDays(p){
  const by={};p.logs.forEach(l=>{(by[l.date]=by[l.date]||new Set()).add(l.cat);});
  const res=[];
  for(const d of Object.keys(by).sort()){const set=by[d];if(set.size<BALANCE_MIN)continue;
    const ps=by[prevDay(d)];
    if(ps&&ps.size>=BALANCE_MIN&&keyOf(ps)===keyOf(set))continue; // same trio as yesterday → doesn't count
    res.push(d);}
  return res;
}
const growth=p=>balancedDays(p).length;
function todayState(p){
  const set=setOn(p,today());const ys=setOn(p,prevDay(today()));
  return {distinct:set.size, sameY:set.size>=BALANCE_MIN&&ys.size>=BALANCE_MIN&&keyOf(ys)===keyOf(set)};
}
/* long neglect → thorns + sleepy stryga (only once the world is underway; opt-out per child) */
const NEGLECT_DAYS=12, SWEEP_DAYS=14;
const daysSinceCat=(p,k)=>{let m=Infinity;p.logs.forEach(l=>{if(l.cat===k){const a=ageOf(l.date);if(a<m)m=a;}});return m;};
const neglected=(p,k)=>p.stryga!==false && growth(p)>=2 && daysSinceCat(p,k)>=NEGLECT_DAYS;
const sweepDone=p=>CATS.every(c=>daysSinceCat(p,c.key)<SWEEP_DAYS);
let clearedKey=null;

function updateBuddy(p,avg,gp){
  const b=$("buddy"),b2=$("buddy2");
  const mood=avg>0.66?"happy":avg>0.34?"content":"nap";
  const skin=avg>0.6?"#ffcf5e":avg>0.34?"#ffd98a":"#e8c98f";
  let outfit=null;MILESTONES.forEach(m=>{if(m.o&&gp>=m.at)outfit=m.o;});
  b.className=mood;b.innerHTML=creatureSVG(skin,mood,outfit,false);
  const hasFriend=gp>=34;
  b2.style.display=hasFriend?"block":"none";
  if(hasFriend){b2.innerHTML=creatureSVG("#ffb6d5",mood==="nap"?"content":mood,null,true);}
  const awake=CATS.filter(c=>stOf(vit(p,c.key))!=="sleepy");
  clearInterval(roamTimer);
  const place=c=>{let L,Tp;if(!c){L="50%";Tp="58%";}else{L=c.x+"%";Tp=(c.y+8)+"%";}b.style.left=L;b.style.top=Tp;if(hasFriend){b2.style.left=`calc(${L} + 10%)`;b2.style.top=Tp;}};
  if(awake.length===0){place(null);}
  else{let i=Math.max(0,awake.findIndex(c=>c.key===lastLogged));place(awake[i]);
    roamTimer=setInterval(()=>{if(MODE!=="child"||cur().minimal){clearInterval(roamTimer);return;}i=(i+1)%awake.length;place(awake[i]);},6000);}
}

  $("pTitle").textContent=T().pTitle;$("pLead").textContent=T().pLead;$("firewall").textContent=T().firewall;
  let quiet=0;CATS.forEach(c=>{let best=0;DB.profiles.forEach(p=>best=Math.max(best,vit(p,c.key)));if(best<0.28)quiet++;});
  if(quiet===0){$("pBig").textContent="🌤️";$("pStrong").textContent=T().sigGood;$("pSpan").textContent=T().sigGoodSub;}
  else{$("pBig").textContent="🌙";$("pStrong").textContent=T().sigQuiet;$("pSpan").textContent=T().sigQuietSub;}
  const allBalanced=DB.profiles.every(p=>{const awake=CATS.filter(c=>stOf(vit(p,c.key))!=="sleepy").length;
    const days=new Set(p.logs.filter(l=>ageOf(l.date)<WINDOW_DAYS).map(l=>l.date)).size;return awake>=5&&days>=5;});
  const yd=$("yesday");if(allBalanced){yd.classList.add("show");$("ydTitle").textContent=T().ydTitle;$("ydBody").textContent=T().ydBody;}else yd.classList.remove("show");
  // child management (parent-only area)
  const mg=$("pManage");mg.innerHTML="";
  const h=document.createElement("div");h.className="jhead";h.textContent=T().manageKids;mg.appendChild(h);
  const note=document.createElement("div");note.style.cssText="font-size:12px;color:var(--muted);margin-bottom:8px";note.textContent=T().lockNote;mg.appendChild(note);
  DB.profiles.forEach(p=>{const row=document.createElement("div");row.className="pm-row";
    row.innerHTML=`<span class="av" style="background:${p.color}">${p.name[0]}</span><span class="pm-n">${p.name}</span>`;
    const lk=document.createElement("button");lk.className="pm-lock";lk.textContent=DB.lockedTo===p.id?"📱 ✓":"📱";
    lk.onclick=()=>{DB.lockedTo=(DB.lockedTo===p.id?null:p.id);localStorage.setItem(LS_KEY,JSON.stringify(DB));render();alert(DB.lockedTo?T().lockedMsg(p.name):T().unlockedMsg);};row.appendChild(lk);
    if(DB.profiles.length>1){const del=document.createElement("button");del.className="pm-del";del.textContent="🗑";del.onclick=()=>deleteProfile(p.id);row.appendChild(del);}
    mg.appendChild(row);});
  const add=document.createElement("button");add.className="pm-add";add.textContent=T().addChild;add.onclick=addChild;mg.appendChild(add);
  const pinb=document.createElement("button");pinb.className="pm-pin";pinb.textContent=DB.pin?T().pinChange:T().pinSet;pinb.onclick=setPin;mg.appendChild(pinb);
}

/* ===================== wiring ===================== */
$("langBtn").onclick=()=>{DB.lang=DB.lang==="en"?"sk":"en";save();render();};
$("modeBtn").onclick=()=>{
  if(MODE==="child"){ if(DB.pin){const v=prompt(T().pinPrompt,"");if(v!==DB.pin){if(v!==null)alert(T().pinWrong);return;}} MODE="parent"; }
  else MODE="child";
  render();};
function setPin(){const v=prompt(T().pinSetPrompt,DB.pin||"");if(v===null)return;DB.pin=v.trim()||null;save();alert(DB.pin?T().pinSaved:T().pinCleared);}
$("minBtn").onclick=()=>{const p=cur();p.minimal=!p.minimal;save();render();};
$("strygaBtn").onclick=()=>{const p=cur();p.stryga=(p.stryga===false);save();render();};
$("printBtn").onclick=()=>window.print();
$("memBtn").onclick=openMem;
function famLink(){return `${location.origin}${location.pathname}?family=${DB.familyId}`;}
$("familyBtn").onclick=()=>{
  $("famTitle").textContent=T().famTitle;$("famSub").textContent=T().famSub;$("famLink").textContent=famLink();
  $("famShare").textContent=T().famShareBtn;$("famJoinLbl").textContent=T().famJoinLbl;$("famJoinBtn").textContent=T().famJoinBtn;
  $("famClose").textContent=T().close;$("famJoinInput").value="";$("famBg").classList.add("show");
};
$("famShare").onclick=async()=>{const link=famLink();
  if(navigator.share){try{await navigator.share({title:"Habitat 🌍",url:link});return;}catch(e){}}
  try{await navigator.clipboard.writeText(link);toast(T().famCopied);}catch(e){prompt(T().famShareBtn,link);}};
$("famJoinBtn").onclick=()=>{const v=$("famJoinInput").value||"";const m=v.match(/[?&]family=([^&\s]+)/);
  const code=(m?decodeURIComponent(m[1]):v).trim().replace(/\s/g,"");
  if(code&&code.length>=12&&code!==DB.familyId){DB.familyId=code;save();$("famBg").classList.remove("show");syncPull();}};
$("famClose").onclick=()=>$("famBg").classList.remove("show");
$("sheetClose").onclick=closeSheet;$("memClose").onclick=()=>$("memBg").classList.remove("show");
["sheetBg","memBg","famBg"].forEach(id=>$(id).onclick=e=>{if(e.target===$(id))$(id).classList.remove("show");});

/* demo seed — 10 varied balanced days (no same trio two days running) + partial today */
if(!DB._seeded){
  const dstr=ago=>new Date(Date.now()-ago*864e5).toISOString().slice(0,10);
  const add=(id,ago,cats)=>{const p=DB.profiles.find(x=>x.id===id);cats.forEach(c=>p.logs.push({cat:c,date:dstr(ago),label:"(seed)"}));};
  const H=[["friends","learn","family"],["friends","learn","space"],["family","home","learn"],["friends","family","space"],["friends","home","learn"],["friends","family","learn"],["learn","space","sport"],["friends","family","learn"],["family","home","learn"],["friends","learn","space"]];
  H.forEach((c,i)=>add("alex",i+1,c)); add("alex",0,["friends","learn"]); // today 2/3
  const M=[["home","learn","space"],["family","home","learn"],["home","space","learn"],["family","home","space"],["home","learn","space"],["family","home","learn"],["home","space","learn"],["family","learn","space"],["home","family","space"],["home","learn","space"]];
  M.forEach((c,i)=>add("sam",i+1,c)); add("sam",0,["home","space"]); // today 2/3
  const Z=[["family","home","self"],["family","learn","space"],["home","family","friends"],["family","self","space"]];
  Z.forEach((c,i)=>add("mia",i+1,c)); add("mia",0,["family"]); // 6yo: fewer, today 1/3
  DB._seeded=true;save();
}
render();ensureScenery();syncPull();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
  let _refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(_refreshing)return;_refreshing=true;location.reload();});
  // check for a newer version when app returns to foreground (iOS-friendly)
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});});
}
$("updateBtn").onclick=async()=>{
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){}
  try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update();}catch(e){}
  location.reload();
};
// in-app install button (Chrome/Android via beforeinstallprompt; iOS shows instructions)
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").style.display="";});
window.addEventListener("appinstalled",()=>{$("installBtn").style.display="none";});
{const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);const standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone;if(isIOS&&!standalone)$("installBtn").style.display="";}
$("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;$("installBtn").style.display="none";}else alert(T().iosInstall);};
</script>
